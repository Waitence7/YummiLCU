# Windows 에이전트: 포터블 zip + Inno Setup 설치 프로그램 + VM 배포
name: Build Yummi Agent (Windows)

on:
  push:
    branches: [main, master]
    paths:
      - "agent/**"
      - "deploy/agent-version.json"
      - ".github/workflows/build-yummi-agent.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "배포 노트 (manifest notes)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$x = Get-Content agent/YummiLcu.App/YummiLcu.App.csproj
          $v = $x.Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (slim, framework-dependent — auto-update ~8MB)
        working-directory: agent/YummiLcu.App
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=false

      - name: Copy agent.json (example → publish)
        run: |
          Copy-Item agent/agent.json.example `
            agent/YummiLcu.App/bin/Release/net8.0-windows/win-x64/publish/agent.json

      - name: Build Inno Setup installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} agent/installer/YummiAgent.iss

      - name: Zip artifact (slim full + patch)
        shell: pwsh
        run: |
          $pub = "agent/YummiLcu.App/bin/Release/net8.0-windows/win-x64/publish"
          Compress-Archive -Path "$pub/*" -DestinationPath YummiAgent-win-x64-portable.zip -Force
          $patchDir = "patch-staging"
          New-Item -ItemType Directory -Force -Path $patchDir | Out-Null
          Copy-Item "$pub/YummiLcu.App.exe", "$pub/YummiLcu.Core.dll" -Destination $patchDir
          Compress-Archive -Path "$patchDir/*" -DestinationPath YummiAgent-patch.zip -Force
          Write-Host "Full zip: $((Get-Item YummiAgent-win-x64-portable.zip).Length / 1MB) MB"
          Write-Host "Patch zip: $((Get-Item YummiAgent-patch.zip).Length / 1MB) MB"

      - name: Sync deploy/agent-version.json from csproj
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $notes = $env:RELEASE_NOTES
          if (-not $notes) {
            $short = $env:GITHUB_SHA.Substring(0, 7)
            $notes = "Build $short"
          }
          & ./deploy/sync-agent-version.ps1 -Notes $notes `
            -ZipPath "YummiAgent-win-x64-portable.zip" `
            -PatchZipPath "YummiAgent-patch.zip" `
            -PatchFrom "0.5.2"

      - uses: actions/upload-artifact@v4
        with:
          name: YummiAgent-win-x64-portable
          path: |
            YummiAgent-win-x64-portable.zip
            YummiAgent-patch.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: YummiAgent-Setup
          path: agent/installer/output/YummiAgent-Setup-${{ steps.ver.outputs.version }}.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: agent-version-json
          path: deploy/agent-version.json
          retention-days: 30

  # SCP 배포: VM 방화벽(ufw)이 22/tcp를 GitHub Actions IP에 열어줘야 함.
  # 특정 IP만 허용이면 dial tcp :22 i/o timeout → VM_DEPLOY_ENABLED=false 후
  # VM에서 ./deploy/vm-deploy-agent.sh --download-only 사용.
  deploy-vm:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.VM_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YummiAgent-win-x64-portable

      - uses: actions/download-artifact@v4
        with:
          name: YummiAgent-Setup

      - uses: actions/download-artifact@v4
        with:
          name: agent-version-json
          path: deploy

      - name: Pack deploy bundle (tar)
        run: |
          set -e
          mkdir -p deploy-bundle
          cp YummiAgent-win-x64-portable.zip deploy-bundle/
          shopt -s nullglob
          for exe in YummiAgent-Setup-*.exe; do cp "$exe" deploy-bundle/; done
          test -f deploy/agent-version.json
          cp deploy/agent-version.json deploy-bundle/
          ls -la deploy-bundle/
          tar czf deploy-bundle.tar.gz -C deploy-bundle .

      - name: Upload bundle to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT != '' && secrets.VM_PORT || '22' }}
          source: deploy-bundle.tar.gz
          target: /tmp
          strip_components: 0

      - name: Install on VM paths
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT != '' && secrets.VM_PORT || '22' }}
          script: |
            set -euo pipefail
            DEPLOY=/tmp/yummi-agent-deploy
            rm -rf "$DEPLOY"
            mkdir -p "$DEPLOY"
            tar xzf /tmp/deploy-bundle.tar.gz -C "$DEPLOY"
            ls -la "$DEPLOY"
            MANIFEST="$DEPLOY/agent-version.json"
            test -f "$MANIFEST"
            VER=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['version'])")
            sudo mkdir -p /var/www/yummi-agent
            sudo cp "$DEPLOY/YummiAgent-win-x64-portable.zip" /var/www/yummi-agent/YummiAgent.zip
            sudo chmod 644 /var/www/yummi-agent/YummiAgent.zip
            if [ -f "$DEPLOY/YummiAgent-patch.zip" ]; then
              sudo cp "$DEPLOY/YummiAgent-patch.zip" /var/www/yummi-agent/YummiAgent-patch.zip
              sudo chmod 644 /var/www/yummi-agent/YummiAgent-patch.zip
            fi
            SETUP=$(ls "$DEPLOY"/YummiAgent-Setup-*.exe 2>/dev/null | head -1 || true)
            if [ -n "$SETUP" ]; then
              sudo cp "$SETUP" "/var/www/yummi-agent/YummiAgent-Setup-${VER}.exe"
              sudo chmod 644 "/var/www/yummi-agent/YummiAgent-Setup-${VER}.exe"
            else
              echo "WARN: no installer exe in bundle (Inno build skipped?)"
            fi
            LCU="${{ secrets.VM_LCU_PATH != '' && secrets.VM_LCU_PATH || '/home/ubuntu/Yummi/YummiLcu' }}"
            cp "$MANIFEST" "$LCU/deploy/agent-version.json"
            sudo cp "$MANIFEST" /var/www/yummi-agent/agent-version.json
            sudo chmod 644 /var/www/yummi-agent/agent-version.json
            rm -f /tmp/deploy-bundle.tar.gz
            echo "Deployed zip + manifest (v${VER})"
