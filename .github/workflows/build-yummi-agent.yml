# Windows 에이전트: 포터블 zip + Inno Setup 설치 프로그램 + VM 배포
name: Build Yummi Agent (Windows)

on:
  push:
    branches: [main, master]
    paths:
      - "agent/**"
      - "deploy/agent-version.json"
      - ".github/workflows/build-yummi-agent.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "배포 노트 (manifest notes)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$x = Get-Content agent/YummiLcu.Agent/YummiLcu.Agent.csproj
          $v = $x.Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (portable, self-contained)
        working-directory: agent/YummiLcu.Agent
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true

      - name: Copy agent.json (example → publish)
        run: |
          Copy-Item agent/agent.json.example `
            agent/YummiLcu.Agent/bin/Release/net8.0-windows/win-x64/publish/agent.json

      - name: Build Inno Setup installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} agent/installer/YummiAgent.iss

      - name: Zip artifact (auto-update)
        run: |
          Compress-Archive -Path agent/YummiLcu.Agent/bin/Release/net8.0-windows/win-x64/publish/* `
            -DestinationPath YummiAgent-win-x64-portable.zip -Force

      - name: Sync deploy/agent-version.json from csproj
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $notes = $env:RELEASE_NOTES
          if (-not $notes) {
            $short = $env:GITHUB_SHA.Substring(0, 7)
            $notes = "Build $short"
          }
          & ./deploy/sync-agent-version.ps1 -Notes $notes

      - uses: actions/upload-artifact@v4
        with:
          name: YummiAgent-win-x64-portable
          path: YummiAgent-win-x64-portable.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: YummiAgent-Setup
          path: agent/installer/output/YummiAgent-Setup-${{ steps.ver.outputs.version }}.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: agent-version-json
          path: deploy/agent-version.json
          retention-days: 30

  deploy-vm:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.VM_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YummiAgent-win-x64-portable

      - uses: actions/download-artifact@v4
        with:
          name: YummiAgent-Setup

      - uses: actions/download-artifact@v4
        with:
          name: agent-version-json
          path: deploy

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-bundle
          cp YummiAgent-win-x64-portable.zip deploy-bundle/
          cp YummiAgent-Setup-*.exe deploy-bundle/ 2>/dev/null || cp *.exe deploy-bundle/
          cp deploy/agent-version.json deploy-bundle/
          ls -la deploy-bundle/

      - name: Deploy to VM (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT != '' && secrets.VM_PORT || '22' }}
          source: "deploy-bundle/*"
          target: "/tmp/yummi-agent-deploy"
          strip_components: 0

      - name: Install on VM paths
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT != '' && secrets.VM_PORT || '22' }}
          script: |
            set -e
            VER=$(python3 -c "import json; print(json.load(open('/tmp/yummi-agent-deploy/agent-version.json'))['version'])")
            sudo mkdir -p /var/www/yummi-agent
            sudo cp /tmp/yummi-agent-deploy/YummiAgent-win-x64-portable.zip /var/www/yummi-agent/YummiAgent.zip
            sudo chmod 644 /var/www/yummi-agent/YummiAgent.zip
            SETUP=$(ls /tmp/yummi-agent-deploy/YummiAgent-Setup-*.exe 2>/dev/null | head -1)
            if [ -n "$SETUP" ]; then
              sudo cp "$SETUP" "/var/www/yummi-agent/YummiAgent-Setup-${VER}.exe"
              sudo chmod 644 "/var/www/yummi-agent/YummiAgent-Setup-${VER}.exe"
            fi
            LCU="${{ secrets.VM_LCU_PATH != '' && secrets.VM_LCU_PATH || '/home/ubuntu/Yummi/YummiLcu' }}"
            cp /tmp/yummi-agent-deploy/agent-version.json "$LCU/deploy/agent-version.json"
            sudo cp "$LCU/deploy/agent-version.json" /var/www/yummi-agent/agent-version.json
            sudo chmod 644 /var/www/yummi-agent/agent-version.json
            rm -rf /tmp/yummi-agent-deploy
            echo "Deployed zip + installer + manifest (v${VER})"
