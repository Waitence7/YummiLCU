name: Publish 0.7.6 Recovery Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-0.7.6-recovery.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing 0.7.6 artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: release
          github-token: ${{ github.token }}
          repository: Waitence7/YummiLCU
          run-id: 33636237617

      - name: Publish v0.7.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/agent-version.json
          test -s release/Yummi-LCU-Agent-0.7.6-setup.exe
          test -s release/tauri-0.7.6.zip
          jq -e '.version == "0.7.6" and .tauri.version == "0.7.6"' release/agent-version.json >/dev/null
          cp release/Yummi-LCU-Agent-0.7.6-setup.exe release/Yummi-LCU-Agent-latest-setup.exe
          if ! gh release view v0.7.6 --repo Waitence7/YummiLCU >/dev/null 2>&1; then
            gh release create v0.7.6 \
              --repo Waitence7/YummiLCU \
              --target 251c7ae5157404313e2ef5b52d957ebe09d2de13 \
              --title "Yummi LCU Agent v0.7.6" \
              --notes "Stable Yummi LCU Agent 0.7.6."
          fi
          gh release upload v0.7.6 \
            release/Yummi-LCU-Agent-0.7.6-setup.exe \
            release/Yummi-LCU-Agent-latest-setup.exe \
            release/tauri-0.7.6.zip \
            release/agent-version.json \
            --repo Waitence7/YummiLCU \
            --clobber
