name: Build Game Bar Overlay (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "오버레이 버전 (비우면 agent-tauri/package.json 사용)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "agent-tauri/gamebar-widget/**"
      - ".github/workflows/build-gamebar-widget.yml"

permissions:
  contents: write

concurrency:
  group: yummi-gamebar-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # UWP/Xbox Game Bar uses the VS2022 Windows XAML toolchain.
    # windows-latest currently resolves to VS2026 where legacy UWP references are incomplete.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.meta.outputs.version }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        run: |
          $sourceVersion = (Get-Content agent-tauri/package.json -Raw | ConvertFrom-Json).version
          $requested = "${{ github.event.inputs.version }}".Trim()
          $version = if ($requested) { $requested } else { $sourceVersion }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "version must be x.y.z" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "appx_version=$version.0" >> $env:GITHUB_OUTPUT

      - name: Restore UWP packages
        run: |
          dotnet restore agent-tauri/gamebar-widget/YummiGameBarWidget.csproj

      - name: Prepare package identity and signing certificate
        id: signing
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPX_VERSION: ${{ steps.meta.outputs.appx_version }}
        run: |
          $certPath = ""
          $publicCertPath = Join-Path $env:RUNNER_TEMP "Yummi-GameBar-Overlay.cer"
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $certPath = Join-Path $env:RUNNER_TEMP "yummi-gamebar.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert) { throw "failed to import signing certificate" }
            "self_signed=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "WINDOWS_CERTIFICATE is not configured; creating a self-signed sideload certificate for this overlay build."
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Yummi Game Bar Overlay" `
              -FriendlyName "Yummi Game Bar Overlay" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -HashAlgorithm SHA256 `
              -KeyUsage DigitalSignature `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
              -CertStoreLocation Cert:\CurrentUser\My `
              -NotAfter (Get-Date).AddYears(5)
            Export-Certificate -Cert $cert -FilePath $publicCertPath -Type CERT | Out-Null
            "self_signed=true" >> $env:GITHUB_OUTPUT
          }
          $publisher = $cert.Subject
          if (-not $publisher) { throw "certificate subject is empty" }

          [xml]$manifest = Get-Content agent-tauri/gamebar-widget/Package.appxmanifest
          $manifest.Package.Identity.Publisher = $publisher
          $manifest.Package.Identity.Version = $env:APPX_VERSION
          $manifest.Save((Resolve-Path agent-tauri/gamebar-widget/Package.appxmanifest))

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "cert_path=$certPath" >> $env:GITHUB_OUTPUT
          "public_cert_path=$publicCertPath" >> $env:GITHUB_OUTPUT
          Write-Host "Game Bar publisher: $publisher"
          Write-Host "Game Bar version: $env:APPX_VERSION"

      - name: Build sideload package
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          $buildLog = Join-Path $env:RUNNER_TEMP "yummi-gamebar-msbuild.log"
          & $msbuild agent-tauri/gamebar-widget/YummiGameBarWidget.csproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /fl `
            "/flp:logfile=$buildLog;verbosity=normal" `
            /m
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $errors = if (Test-Path $buildLog) {
              Get-Content $buildLog | Where-Object { $_ -match '(?i)(: error |error [A-Z]+[0-9]+:|error MSB[0-9]+:)' } | Select-Object -Unique -First 8
            } else { @() }
            if ($errors.Count -eq 0 -and (Test-Path $buildLog)) {
              $errors = Get-Content $buildLog -Tail 40 | Select-Object -First 8
            }
            foreach ($line in $errors) {
              $annotation = $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Game Bar MSBuild::$annotation"
            }
            throw "Game Bar MSBuild failed with exit code $buildExitCode"
          }

      - name: Sign package and make standalone download
        id: pack
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CERT_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          SELF_SIGNED: ${{ steps.signing.outputs.self_signed }}
          PUBLIC_CERT_PATH: ${{ steps.signing.outputs.public_cert_path }}
        run: |
          $root = Resolve-Path agent-tauri/gamebar-widget
          $package = Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in '.appx', '.msix' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $package) { throw "Game Bar app package not found" }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          if ($env:SELF_SIGNED -eq 'true') {
            # A local sideload certificate does not need a public timestamp and
            # avoiding the network keeps CI deterministic.
            $signOutput = & $signtool.FullName sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 $package.FullName 2>&1
          } else {
            $signOutput = & $signtool.FullName sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $package.FullName 2>&1
          }
          $signExitCode = $LASTEXITCODE
          $signOutput | Write-Host
          if ($signExitCode -ne 0) {
            $detail = (($signOutput | Select-Object -Last 12) -join ' | ').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Game Bar AppX signing::$detail"
            throw "AppX signing failed with exit code $signExitCode"
          }

          # signtool /pa also validates the certificate trust chain. A generated
          # sideload certificate is intentionally untrusted on the ephemeral runner;
          # accept only that exact trust-chain failure after signing succeeded.
          $verifyOutput = & $signtool.FullName verify /pa /v $package.FullName 2>&1
          $verifyExitCode = $LASTEXITCODE
          $verifyOutput | Write-Host
          if ($verifyExitCode -ne 0) {
            $verifyText = ($verifyOutput -join "`n")
            $expectedSelfSignedTrustFailure = $env:SELF_SIGNED -eq 'true' -and
              $verifyText -match '(?i)root certificate which is not trusted by the trust provider'
            if ($expectedSelfSignedTrustFailure) {
              Write-Warning "AppX signature is present; trust-chain failure is expected for the bundled self-signed sideload certificate."
            } else {
              $detail = (($verifyOutput | Select-Object -Last 12) -join ' | ').Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Game Bar AppX verification::$detail"
              throw "AppX signature verification failed with exit code $verifyExitCode"
            }
          }

          $stage = Join-Path $env:RUNNER_TEMP "gamebar-overlay"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $packageName = "Yummi-GameBar-Overlay-$env:VERSION$($package.Extension)"
          Copy-Item $package.FullName (Join-Path $stage $packageName) -Force

          $dependencies = Get-ChildItem $root -Recurse -Directory -Filter Dependencies -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dependencies) { Copy-Item $dependencies.FullName (Join-Path $stage 'Dependencies') -Recurse -Force }

          Copy-Item agent-tauri/gamebar-widget/Install-YummiGameBar.ps1 (Join-Path $stage 'Install-YummiGameBar.ps1') -Force
          Copy-Item agent-tauri/gamebar-widget/README.md (Join-Path $stage 'README.md') -Force
          $publicCert = "${{ steps.signing.outputs.public_cert_path }}"
          if ("${{ steps.signing.outputs.self_signed }}" -eq "true" -and $publicCert -and (Test-Path $publicCert)) {
            Copy-Item $publicCert (Join-Path $stage 'Yummi-GameBar-Overlay.cer') -Force
          }

          $zipName = "Yummi-GameBar-Overlay-$env:VERSION.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipName -Force
          "artifact_name=$zipName" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: yummi-gamebar-overlay-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.pack.outputs.artifact_name }}
          retention-days: 14

      - name: Upload to matching GitHub release when available
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.pack.outputs.artifact_name }}
        run: |
          $stableTag = "v$env:VERSION"
          $betaMeta = Get-Content agent-tauri/beta-release.json -Raw | ConvertFrom-Json
          $betaTag = if ($betaMeta.version -eq $env:VERSION) { "v$env:VERSION-beta.$($betaMeta.number)" } else { $null }
          $tag = $null
          if (gh release view $stableTag --repo $env:GITHUB_REPOSITORY 2>$null) { $tag = $stableTag }
          elseif ($betaTag -and (gh release view $betaTag --repo $env:GITHUB_REPOSITORY 2>$null)) { $tag = $betaTag }
          if ($tag) {
            gh release upload $tag $env:ZIP --repo $env:GITHUB_REPOSITORY --clobber
            Write-Host "Uploaded Game Bar overlay to $tag"
          } else {
            Write-Host "No matching release exists yet; artifact is available from this workflow run."
          }

      - name: Cleanup certificate
        if: always()
        env:
          CERT_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          CERT_PATH: ${{ steps.signing.outputs.cert_path }}
        run: |
          if ($env:CERT_PATH) { Remove-Item $env:CERT_PATH -Force -ErrorAction SilentlyContinue }
          if ($env:CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\TrustedPeople\$env:CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
