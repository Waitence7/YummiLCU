name: Release Yummi LCU Agent 0.7.1 Direct

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Configure release metadata
        run: |
          $version = (Get-Content agent-tauri/package.json | ConvertFrom-Json).version
          if ($version -ne "0.7.1") { throw "expected 0.7.1, got $version" }
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $buildId = "$date.$env:GITHUB_RUN_NUMBER"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "YUMMI_AGENT_RELEASE_CHANNEL=stable" >> $env:GITHUB_ENV
          "YUMMI_AGENT_RELEASE_LABEL=0.7.1" >> $env:GITHUB_ENV
          "YUMMI_AGENT_BUILD_ID=$buildId" >> $env:GITHUB_ENV
          "YUMMI_AGENT_GIT_COMMIT=$shortSha" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-tauri/package-lock.json

      - name: Configure update verification keys
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
          PUBLIC_KEY_VAR: ${{ vars.YUMMI_AGENT_MANIFEST_PUBLIC_KEY }}
          PUBLIC_KEY_SECRET: ${{ secrets.YUMMI_AGENT_MANIFEST_PUBLIC_KEY }}
          CERT_THUMBPRINT_VAR: ${{ vars.YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT }}
          CERT_THUMBPRINT_SECRET: ${{ secrets.YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          if (-not $env:MANIFEST_SIGNING_KEY) { throw "YUMMI_AGENT_MANIFEST_SIGNING_KEY secret is required" }
          $publicKey = if ($env:PUBLIC_KEY_VAR) { $env:PUBLIC_KEY_VAR } else { $env:PUBLIC_KEY_SECRET }
          if (-not $publicKey) { throw "YUMMI_AGENT_MANIFEST_PUBLIC_KEY is required" }
          "YUMMI_AGENT_MANIFEST_PUBLIC_KEY=$publicKey" >> $env:GITHUB_ENV
          $thumbprint = if ($env:CERT_THUMBPRINT_VAR) { $env:CERT_THUMBPRINT_VAR } else { $env:CERT_THUMBPRINT_SECRET }
          if ($thumbprint) { "YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV }

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        working-directory: agent-tauri
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: agent-tauri
        run: npm run build

      - name: Rust tests
        working-directory: agent-tauri/src-tauri
        run: cargo test --locked

      - name: Build Tauri bundles
        working-directory: agent-tauri
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Locate and sign Windows artifacts
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $releaseRoot = "agent-tauri/src-tauri/target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path $releaseRoot)) { $releaseRoot = "agent-tauri/src-tauri/target/release" }
          $exe = Join-Path $releaseRoot "yummi-lcu-tauri.exe"
          if (-not (Test-Path $exe)) { throw "Tauri exe not found: $exe" }
          $nsis = Get-ChildItem "$releaseRoot/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $msi = Get-ChildItem "$releaseRoot/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }

          $files = @($exe, $nsis.FullName)
          if ($msi) { $files += $msi.FullName }
          if ($env:WINDOWS_CERTIFICATE) {
            if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required" }
            $certPath = Join-Path $env:RUNNER_TEMP "yummi-agent-code-signing.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert) { throw "failed to import code signing certificate" }
            if ($env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT -and ($cert.Thumbprint.ToLowerInvariant() -ne $env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT.ToLowerInvariant())) { throw "certificate thumbprint mismatch" }
            foreach ($file in $files) {
              Set-AuthenticodeSignature -FilePath $file -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256 | Out-Null
              $sig = Get-AuthenticodeSignature -FilePath $file
              if ($sig.Status -ne "Valid") { throw "code signing failed for ${file}: $($sig.Status)" }
            }
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          } elseif ($env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT) {
            throw "signing thumbprint configured but WINDOWS_CERTIFICATE missing"
          }

          "YUMMI_RELEASE_EXE=$exe" >> $env:GITHUB_ENV
          "YUMMI_RELEASE_NSIS=$($nsis.FullName)" >> $env:GITHUB_ENV

      - name: Build portable zip and signed manifest
        env:
          YUMMI_AGENT_MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
        run: |
          $version = "0.7.1"
          $stage = Join-Path $env:RUNNER_TEMP "tauri-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $stageExe = Join-Path $stage "yummi-lcu-tauri.exe"
          Copy-Item $env:YUMMI_RELEASE_EXE $stageExe -Force
          $setup = "Yummi-LCU-Agent-$version-setup.exe"
          Copy-Item $env:YUMMI_RELEASE_NSIS $setup -Force
          $zip = "tauri-$version.zip"
          Compress-Archive -Path $stageExe -DestinationPath $zip -Force
          node scripts/sync-tauri-agent-version.mjs `
            --zip $zip `
            --exe $stageExe `
            --out agent-version.json `
            --notes "Yummi LCU Agent 0.7.1 stable: HTML-in-Canvas CanvasDrawElement Blink/runtime/experimental flags enabled." `
            --channel stable `
            --release-label 0.7.1 `
            --build-id $env:YUMMI_AGENT_BUILD_ID `
            --commit $env:YUMMI_AGENT_GIT_COMMIT `
            --rollout-percent 100

      - name: Deploy stable update directly
        env:
          AGENT_DEPLOY_TOKEN: ${{ secrets.YUMMI_AGENT_DEPLOY_TOKEN }}
        run: |
          if (-not $env:AGENT_DEPLOY_TOKEN) { throw "YUMMI_AGENT_DEPLOY_TOKEN is required" }
          $headers = @{ Authorization = "Bearer $env:AGENT_DEPLOY_TOKEN" }
          Invoke-WebRequest -UseBasicParsing -Method Put -Uri "https://yummi.duckdns.org/agent-deploy/manifest" -Headers $headers -ContentType "application/json" -InFile "agent-version.json" | Out-Null
          Invoke-WebRequest -UseBasicParsing -Method Put -Uri "https://yummi.duckdns.org/agent-deploy/installer/0.7.1" -Headers $headers -ContentType "application/octet-stream" -InFile "Yummi-LCU-Agent-0.7.1-setup.exe" | Out-Null
          Invoke-WebRequest -UseBasicParsing -Method Put -Uri "https://yummi.duckdns.org/agent-deploy/archive/0.7.1" -Headers $headers -ContentType "application/zip" -InFile "tauri-0.7.1.zip" | Out-Null

      - name: Verify public stable release
        run: |
          $manifest = Invoke-RestMethod -Uri "https://yummi.duckdns.org/agent/version.json"
          if ($manifest.version -ne "0.7.1") { throw "public version mismatch: $($manifest.version)" }
          if ($manifest.tauri.version -ne "0.7.1") { throw "public tauri version mismatch" }
          if ($manifest.tauri.channel -ne "stable") { throw "public channel mismatch" }
          if ($manifest.tauri.releaseLabel -ne "0.7.1") { throw "public release label mismatch" }
          if ($manifest.tauri.buildId -ne $env:YUMMI_AGENT_BUILD_ID) { throw "public build id mismatch" }
          Invoke-WebRequest -UseBasicParsing -Method Head -Uri "https://yummi.duckdns.org/agent/releases/tauri/tauri-0.7.1.zip" | Out-Null
          Invoke-WebRequest -UseBasicParsing -Method Head -Uri "https://yummi.duckdns.org/agent/releases/tauri/latest-setup.exe" | Out-Null
          Write-Host "0.7.1 stable release verified: build $env:YUMMI_AGENT_BUILD_ID commit $env:YUMMI_AGENT_GIT_COMMIT"
