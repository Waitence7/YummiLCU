name: Publish 0.7.5 Recovery Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-0.7.5-recovery.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing successful 0.7.5 artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: release
          github-token: ${{ github.token }}
          repository: Waitence7/YummiLCU
          run-id: 33398186046

      - name: Verify recovered files
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 2 -type f -printf '%p %s\n'
          test -s release/Yummi-LCU-Agent-0.7.5-setup.exe
          test -s release/tauri-0.7.5.zip
          test -s release/agent-version.json

      - name: Publish public recovery release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v0.7.5 --repo Waitence7/YummiLCU >/dev/null 2>&1; then
            gh release create v0.7.5               --repo Waitence7/YummiLCU               --target "${GITHUB_SHA}"               --title "Yummi LCU Agent v0.7.5"               --notes "Recovery publication of the already-built 0.7.5 stable artifacts."
          fi
          gh release upload v0.7.5             release/Yummi-LCU-Agent-0.7.5-setup.exe             release/tauri-0.7.5.zip             release/agent-version.json             --repo Waitence7/YummiLCU             --clobber
