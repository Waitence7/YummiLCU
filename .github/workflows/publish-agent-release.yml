name: Publish Agent GitHub Release

on:
  workflow_run:
    workflows: ["Build Tauri Agent (Windows)"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Download built release artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish versioned and latest installer
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' release/agent-version.json)"
          test -n "$version"
          test "$version" != "null"
          installer="release/Yummi-LCU-Agent-${version}-setup.exe"
          archive="release/tauri-${version}.zip"
          test -s "$installer"
          test -s "$archive"
          cp "$installer" release/Yummi-LCU-Agent-latest-setup.exe

          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$TARGET_SHA" \
              --title "Yummi LCU Agent ${tag}" \
              --notes "Stable Yummi LCU Agent release."
          fi
          gh release upload "$tag" \
            "$installer" \
            release/Yummi-LCU-Agent-latest-setup.exe \
            "$archive" \
            release/agent-version.json \
            --clobber
