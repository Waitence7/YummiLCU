name: Publish Agent Beta 54 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-agent-beta54-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'chore(release): publish beta.54 candidate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          gh run download 41601756465 --repo "$GITHUB_REPOSITORY" --name agent-candidate --dir release
          test -s release/agent-version.json
          test "$(jq -r '.version' release/agent-version.json)" = "0.8.0"
          test "$(jq -r '.tauri.commit' release/agent-version.json)" = "eef6148"
          test -s release/tauri-0.8.0.zip
          test -s release/Yummi-LCU-Agent-0.8.0-setup.exe

      - name: Prepare beta.54 signed manifest
        env:
          YUMMI_AGENT_MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          build_id="$(jq -r '.tauri.buildId' release/agent-version.json)"
          stage="${RUNNER_TEMP}/tauri-portable"
          rm -rf "$stage"
          mkdir -p "$stage"
          unzip -q release/tauri-0.8.0.zip -d "$stage"
          exe="$(find "$stage" -maxdepth 2 -type f -iname 'yummi-lcu-tauri.exe' -print -quit)"
          test -n "$exe" && test -s "$exe"
          node scripts/sync-tauri-agent-version.mjs \
            --zip release/tauri-0.8.0.zip \
            --exe "$exe" \
            --out release/agent-version.json \
            --notes '라이브 공유 앱 제어 및 관전자 커서/핑 기능 재빌드 배포' \
            --channel beta \
            --release-label 0.8.0-beta.54 \
            --build-id "$build_id" \
            --commit eef6148 \
            --rollout-percent 100
          jq -e '.version == "0.8.0" and .tauri.channel == "beta" and .tauri.releaseLabel == "0.8.0-beta.54" and .tauri.commit == "eef6148"' release/agent-version.json >/dev/null

      - name: Publish beta.54 and update server
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_DEPLOY_TOKEN: ${{ secrets.YUMMI_AGENT_DEPLOY_TOKEN }}
          RELEASE_CHANNEL: beta
          RELEASE_LABEL: 0.8.0-beta.54
          TARGET_SHA: eef6148aa6539c363e57bce9be526a4fd691dd0b
        run: scripts/publish-agent-release.sh release
