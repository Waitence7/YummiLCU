name: Repair Agent Stable Pointer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-agent-stable-pointer.yml"

permissions:
  actions: read
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse verified 0.7.6 artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-release
          path: release
          github-token: ${{ github.token }}
          repository: Waitence7/YummiLCU
          run-id: 33636237617

      - name: Publish stable channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.version == "0.7.6" and .tauri.version == "0.7.6" and .tauri.channel == "stable"' release/agent-version.json >/dev/null
          test -s release/Yummi-LCU-Agent-0.7.6-setup.exe
          test -s release/tauri-0.7.6.zip
          cp release/Yummi-LCU-Agent-0.7.6-setup.exe release/Yummi-LCU-Agent-latest-setup.exe
          cp release/tauri-0.7.6.zip release/tauri-latest.zip

          if ! gh release view agent-stable --repo Waitence7/YummiLCU >/dev/null 2>&1; then
            gh release create agent-stable               --repo Waitence7/YummiLCU               --target 251c7ae5157404313e2ef5b52d957ebe09d2de13               --title "Yummi LCU Agent stable"               --notes "Mutable stable channel pointer."
          fi
          gh release upload agent-stable             release/Yummi-LCU-Agent-0.7.6-setup.exe             release/Yummi-LCU-Agent-latest-setup.exe             release/tauri-0.7.6.zip             release/tauri-latest.zip             release/agent-version.json             --repo Waitence7/YummiLCU             --clobber
