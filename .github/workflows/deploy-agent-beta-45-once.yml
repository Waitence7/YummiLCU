name: Deploy Agent Beta 45 Recovery Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-agent-beta-45-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download last known-good desktop candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          gh run download 41387170218 --repo "$GITHUB_REPOSITORY" --name agent-candidate --dir release
          test -s release/agent-version.json
          jq -e '.version == "0.8.0" and .tauri.version == "0.8.0" and .tauri.commit == "ef2d826"' release/agent-version.json >/dev/null
          test -s release/Yummi-LCU-Agent-0.8.0-setup.exe
          test -s release/tauri-0.8.0.zip
      - name: Prepare beta.45 recovery manifest
        env:
          YUMMI_AGENT_MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(jq -r '.tauri.buildId // .buildId' release/agent-version.json)"
          stage="${RUNNER_TEMP}/tauri-portable"
          rm -rf "$stage" && mkdir -p "$stage"
          unzip -q release/tauri-0.8.0.zip -d "$stage"
          exe="$(find "$stage" -maxdepth 2 -type f -iname 'yummi-lcu-tauri.exe' -print -quit)"
          test -n "$exe" && test -s "$exe"
          node scripts/sync-tauri-agent-version.mjs \
            --zip release/tauri-0.8.0.zip \
            --exe "$exe" \
            --out release/agent-version.json \
            --notes "Emergency recovery: restore the last known-good desktop startup path while the native Game Bar input shield is validated separately." \
            --channel beta \
            --release-label 0.8.0-beta.45 \
            --build-id "$build_id" \
            --commit ef2d826 \
            --rollout-percent 100
          jq -e '.version == "0.8.0" and .tauri.channel == "beta" and .tauri.releaseLabel == "0.8.0-beta.45" and .tauri.commit == "ef2d826" and .tauri.rolloutPercent == 100' release/agent-version.json >/dev/null
      - name: Publish beta.45 recovery
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_DEPLOY_TOKEN: ${{ secrets.YUMMI_AGENT_DEPLOY_TOKEN }}
          RELEASE_CHANNEL: beta
          RELEASE_LABEL: 0.8.0-beta.45
          TARGET_SHA: ef2d82623fe4b70b63a21a73a4ad600a65c150c4
        shell: bash
        run: scripts/publish-agent-release.sh release
