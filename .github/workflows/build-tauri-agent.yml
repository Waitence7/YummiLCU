name: Deploy LCU Tauri Agent (manual Actions button)

on:
  push:
    branches: [main]
    paths:
      - "agent-tauri/**"
      - "!agent-tauri/gamebar-widget/**"
      - ".github/workflows/build-tauri-agent.yml"
      - "scripts/publish-agent-release.sh"
  workflow_dispatch:
    inputs:
      version:
        description: "배포할 버전 (소스 버전과 반드시 일치)"
        required: true
        type: string
      release_notes:
        description: "배포 노트"
        required: false
        default: ""
      channel:
        description: "업데이트 채널"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - dev
      beta_number:
        description: "beta 번호 (beta 채널에서 beta.1, beta.2 ...)"
        required: false
        default: "1"
      rollout_percent:
        description: "rollout percent (0-100)"
        required: false
        default: "100"
      source_sha:
        description: "배포할 main 커밋 SHA (비우면 최신 성공 후보)"
        required: false
        default: ""

# main push 빌드는 최신 것만 남기고, 수동 배포는 서로 취소하지 않고 직렬화한다.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'yummi-lcu-agent-release' || format('yummi-lcu-agent-build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: read

jobs:
  relay-tests:
    name: Relay protocol contract
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install relay dependencies
        run: uv sync --frozen
      - name: Relay and Agent protocol tests
        run: uv run --frozen python -m unittest discover -s relay -p "test_*.py"

  rust-tests:
    name: Rust tests
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-tauri/src-tauri
          cache-targets: true
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Rust tests
        run: cargo test --locked --jobs 4

  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      channel: ${{ steps.release_meta.outputs.channel }}
      release_label: ${{ steps.release_meta.outputs.release_label }}
      build_id: ${{ steps.release_meta.outputs.build_id }}
    defaults:
      run:
        shell: pwsh
    env:
      PUBLIC_KEY_VAR: ${{ vars.YUMMI_AGENT_MANIFEST_PUBLIC_KEY }}
      PUBLIC_KEY_SECRET: ${{ secrets.YUMMI_AGENT_MANIFEST_PUBLIC_KEY }}
      CERT_THUMBPRINT_VAR: ${{ vars.YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT }}
      CERT_THUMBPRINT_SECRET: ${{ secrets.YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT }}
      # GitHub-hosted Windows runner is 4 vCPU. Keep Cargo saturated without oversubscribing it.
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/agent-tauri/src-tauri/target
    steps:
      - uses: actions/checkout@v4

      - name: Validate release versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content agent-tauri/package.json | ConvertFrom-Json).version
          $packageLock = Get-Content agent-tauri/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $packageLockVersion = $packageLock['version']
          $packageLockRootVersion = $packageLock['packages']['']['version']
          $tauriVersion = (Get-Content agent-tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoTomlText = Get-Content agent-tauri/src-tauri/Cargo.toml -Raw
          if ($cargoTomlText -notmatch '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"') { throw "Cargo.toml package version not found" }
          $cargoTomlVersion = $Matches[1]
          $cargoLockText = Get-Content agent-tauri/src-tauri/Cargo.lock -Raw
          $cargoLockPattern = '(?ms)\[\[package\]\]\s*name\s*=\s*"yummi-lcu-tauri"\s*version\s*=\s*"([^"]+)"'
          if ($cargoLockText -notmatch $cargoLockPattern) { throw "Cargo.lock yummi-lcu-tauri version not found" }
          $cargoLockVersion = $Matches[1]
          $versions = @{
            'package.json' = $packageVersion
            'package-lock.json' = $packageLockVersion
            'package-lock root' = $packageLockRootVersion
            'Cargo.toml' = $cargoTomlVersion
            'Cargo.lock' = $cargoLockVersion
            'tauri.conf.json' = $tauriVersion
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $packageVersion) {
              throw "Version mismatch: $($entry.Key)=$($entry.Value), expected=$packageVersion"
            }
          }
          Write-Host "Version preflight OK: $packageVersion"

      - name: Configure candidate metadata
        id: release_meta
        run: |
          $version = (Get-Content agent-tauri/package.json | ConvertFrom-Json).version
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $buildId = "$date.$env:GITHUB_RUN_NUMBER"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $releaseLabel = "$version-candidate.$env:GITHUB_RUN_NUMBER"
          "YUMMI_AGENT_RELEASE_CHANNEL=dev" >> $env:GITHUB_ENV
          "YUMMI_AGENT_RELEASE_LABEL=$releaseLabel" >> $env:GITHUB_ENV
          "YUMMI_AGENT_BUILD_ID=$buildId" >> $env:GITHUB_ENV
          "YUMMI_AGENT_GIT_COMMIT=$shortSha" >> $env:GITHUB_ENV
          "channel=dev" >> $env:GITHUB_OUTPUT
          "release_label=$releaseLabel" >> $env:GITHUB_OUTPUT
          "build_id=$buildId" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-tauri/package-lock.json

      - name: Configure update verification keys
        if: github.event_name != 'pull_request'
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
        run: |
          if (-not $env:MANIFEST_SIGNING_KEY) {
            throw "YUMMI_AGENT_MANIFEST_SIGNING_KEY secret is required"
          }
          $publicKey = if ($env:PUBLIC_KEY_VAR) { $env:PUBLIC_KEY_VAR } else { $env:PUBLIC_KEY_SECRET }
          if (-not $publicKey) {
            throw "YUMMI_AGENT_MANIFEST_PUBLIC_KEY variable or secret is required"
          }
          "YUMMI_AGENT_MANIFEST_PUBLIC_KEY=$publicKey" >> $env:GITHUB_ENV

          $thumbprint = if ($env:CERT_THUMBPRINT_VAR) { $env:CERT_THUMBPRINT_VAR } else { $env:CERT_THUMBPRINT_SECRET }
          if ($thumbprint) {
            "YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          }

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-tauri/src-tauri
          cache-targets: true
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        working-directory: agent-tauri
        run: npm ci

      - name: Typecheck frontend
        working-directory: agent-tauri
        # tauri build가 tauri.conf.json의 beforeBuildCommand(npm run build)를 실행하므로
        # 여기서는 Vite bundle을 중복 생성하지 않고 타입만 먼저 검사한다.
        run: npm exec -- tsc --noEmit

      - name: Build Tauri bundles
        working-directory: agent-tauri
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Locate Tauri artifacts
        id: artifacts
        run: |
          $releaseRoot = "agent-tauri/src-tauri/target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path $releaseRoot)) {
            $releaseRoot = "agent-tauri/src-tauri/target/release"
          }
          $exe = Join-Path $releaseRoot "yummi-lcu-tauri.exe"
          if (-not (Test-Path $exe)) { throw "Tauri exe not found: $exe" }
          $nsis = Get-ChildItem "$releaseRoot/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          "exe=$exe" >> $env:GITHUB_OUTPUT
          if ($nsis) { "nsis=$($nsis.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Code sign Windows artifacts
        if: github.event_name != 'pull_request'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $files = @("${{ steps.artifacts.outputs.exe }}")
          if ("${{ steps.artifacts.outputs.nsis }}") { $files += "${{ steps.artifacts.outputs.nsis }}" }

          if (-not $env:WINDOWS_CERTIFICATE) {
            if ($env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT) {
              throw "YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT is set but WINDOWS_CERTIFICATE is missing"
            }
            Write-Warning "WINDOWS_CERTIFICATE is not configured; artifacts are unsigned"
            exit 0
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is configured"
          }

          $certPath = Join-Path $env:RUNNER_TEMP "yummi-agent-code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert) { throw "failed to import code signing certificate" }
          if ($env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT -and
              ($cert.Thumbprint.ToLowerInvariant() -ne $env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT.ToLowerInvariant())) {
            throw "imported certificate thumbprint does not match YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT"
          }

          foreach ($file in $files) {
            Set-AuthenticodeSignature `
              -FilePath $file `
              -Certificate $cert `
              -TimestampServer "http://timestamp.digicert.com" `
              -HashAlgorithm SHA256 | Format-List
            $sig = Get-AuthenticodeSignature -FilePath $file
            if ($sig.Status -ne "Valid") {
              $selfSigned = $cert.Subject -eq $cert.Issuer
              $expectedSelfSignedTrustFailure = $selfSigned -and
                $sig.SignerCertificate -and
                ($sig.SignerCertificate.Thumbprint -eq $cert.Thumbprint) -and
                ($sig.StatusMessage -match '(?i)root certificate which is not trusted by the trust provider')
              if ($expectedSelfSignedTrustFailure) {
                Write-Warning "Authenticode signature is present; root trust failure is expected for the configured self-signed certificate."
              } else {
                throw "code signing validation failed for ${file}: $($sig.Status) / $($sig.StatusMessage)"
              }
            }
          }

          Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue

      - name: Build portable zip and signed manifest
        if: github.event_name != 'pull_request'
        id: manifest
        env:
          YUMMI_AGENT_MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
          RELEASE_NOTES: "Verified main candidate"
          CHANNEL: dev
          ROLLOUT_PERCENT: "100"
        run: |
          $version = (Get-Content agent-tauri/package.json | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP "tauri-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $stageExe = Join-Path $stage "yummi-lcu-tauri.exe"
          Copy-Item "${{ steps.artifacts.outputs.exe }}" $stageExe -Force
          $nsisPath = "${{ steps.artifacts.outputs.nsis }}"
          if (-not $nsisPath -or -not (Test-Path $nsisPath)) { throw "NSIS installer not found" }
          $setup = "Yummi-LCU-Agent-$version-setup.exe"
          Copy-Item $nsisPath $setup -Force
          $zip = "tauri-$version.zip"
          Compress-Archive -Path $stageExe -DestinationPath $zip -Force
          $notes = if ($env:RELEASE_NOTES) { $env:RELEASE_NOTES } else { "Tauri $env:YUMMI_AGENT_RELEASE_LABEL build $env:YUMMI_AGENT_BUILD_ID ($env:YUMMI_AGENT_GIT_COMMIT)" }
          node scripts/sync-tauri-agent-version.mjs `
            --zip $zip `
            --exe $stageExe `
            --out agent-version.json `
            --notes $notes `
            --channel $env:CHANNEL `
            --release-label $env:YUMMI_AGENT_RELEASE_LABEL `
            --build-id $env:YUMMI_AGENT_BUILD_ID `
            --commit $env:YUMMI_AGENT_GIT_COMMIT `
            --rollout-percent $env:ROLLOUT_PERCENT
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: agent-candidate
          path: |
            ${{ steps.manifest.outputs.zip }}
            ${{ steps.manifest.outputs.setup }}
            agent-version.json
          if-no-files-found: error
          retention-days: 7


      - name: Prune old workflow artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const keepRuns = 2;
            const keepRunIds = new Set([context.runId]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build-tauri-agent.yml',
                status: 'success',
                per_page: 20,
              }
            );

            for (const run of runs) {
              if (keepRunIds.has(run.id)) continue;
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              if (data.jobs.some((job) => job.name === 'build' && job.conclusion === 'success')) {
                keepRunIds.add(run.id);
                if (keepRunIds.size >= keepRuns) break;
              }
            }

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            let deleted = 0;
            let freed = 0;
            for (const artifact of artifacts) {
              if (keepRunIds.has(artifact.workflow_run.id)) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
              freed += artifact.size_in_bytes || 0;
            }
            core.info('Deleted ' + deleted + ' old artifact(s), ~' + (freed / 1024 / 1024).toFixed(1) + ' MB');


  deploy-existing-candidate:
    name: Deploy existing verified agent candidate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and download verified candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED_SHA: ${{ github.event.inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          requested_sha="${REQUESTED_SHA//[[:space:]]/}"
          if [ -n "$requested_sha" ]; then
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-tauri-agent.yml/runs?head_sha=${requested_sha}&event=push&status=success&per_page=20")"
          else
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-tauri-agent.yml/runs?branch=main&event=push&status=success&per_page=50")"
          fi

          run_id=""
          source_sha=""
          while IFS=$'\t' read -r id sha; do
            [ -n "$id" ] || continue
            artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100")"
            if jq -e '.artifacts[] | select(.name == "agent-candidate" and .expired == false)' <<<"$artifacts" >/dev/null; then
              run_id="$id"
              source_sha="$sha"
              break
            fi
          done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<<"$runs")

          test -n "$run_id" || { echo "No successful main candidate artifact found" >&2; exit 1; }
          rm -rf release
          mkdir -p release
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name agent-candidate --dir release

          test -s release/agent-version.json
          candidate_version="$(jq -r '.version' release/agent-version.json)"
          build_id="$(jq -r '.tauri.buildId' release/agent-version.json)"
          source_short="${source_sha:0:7}"
          test "$candidate_version" = "$REQUESTED_VERSION" || {
            echo "Candidate version $candidate_version does not match requested $REQUESTED_VERSION" >&2
            exit 1
          }
          jq -e --arg commit "$source_short" '.tauri.commit == $commit' release/agent-version.json >/dev/null
          test -s "release/Yummi-LCU-Agent-${candidate_version}-setup.exe"
          test -s "release/tauri-${candidate_version}.zip"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_short=$source_short" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Prepare final signed release manifest
        id: release_meta
        env:
          YUMMI_AGENT_MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
          VERSION: ${{ github.event.inputs.version }}
          CHANNEL: ${{ github.event.inputs.channel }}
          BETA_NUMBER: ${{ github.event.inputs.beta_number }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          ROLLOUT_PERCENT: ${{ github.event.inputs.rollout_percent || '100' }}
          SOURCE_SHORT: ${{ steps.candidate.outputs.source_short }}
          BUILD_ID: ${{ steps.candidate.outputs.build_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable) release_label="$VERSION" ;;
            beta)
              [[ "$BETA_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "beta_number must be a positive integer" >&2; exit 1; }
              release_label="$VERSION-beta.$BETA_NUMBER"
              ;;
            dev) release_label="$VERSION-dev.${GITHUB_RUN_NUMBER}" ;;
            *) echo "Unsupported channel: $CHANNEL" >&2; exit 1 ;;
          esac
          [[ "$ROLLOUT_PERCENT" =~ ^[0-9]+$ ]] && [ "$ROLLOUT_PERCENT" -ge 0 ] && [ "$ROLLOUT_PERCENT" -le 100 ] || {
            echo "rollout_percent must be 0-100" >&2
            exit 1
          }

          stage="${RUNNER_TEMP}/tauri-portable"
          rm -rf "$stage"
          mkdir -p "$stage"
          unzip -q "release/tauri-${VERSION}.zip" -d "$stage"
          exe="$(find "$stage" -maxdepth 2 -type f -iname 'yummi-lcu-tauri.exe' -print -quit)"
          test -n "$exe" && test -s "$exe"
          notes="${RELEASE_NOTES:-Tauri ${release_label} build ${BUILD_ID} (${SOURCE_SHORT})}"

          node scripts/sync-tauri-agent-version.mjs \
            --zip "release/tauri-${VERSION}.zip" \
            --exe "$exe" \
            --out release/agent-version.json \
            --notes "$notes" \
            --channel "$CHANNEL" \
            --release-label "$release_label" \
            --build-id "$BUILD_ID" \
            --commit "$SOURCE_SHORT" \
            --rollout-percent "$ROLLOUT_PERCENT"

          jq -e \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg label "$release_label" \
            --arg commit "$SOURCE_SHORT" \
            '.version == $version and .tauri.version == $version and .tauri.channel == $channel and .tauri.releaseLabel == $label and .tauri.commit == $commit' \
            release/agent-version.json >/dev/null

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release_label=$release_label" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release and update server
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_DEPLOY_TOKEN: ${{ secrets.YUMMI_AGENT_DEPLOY_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.release_meta.outputs.channel }}
          RELEASE_LABEL: ${{ steps.release_meta.outputs.release_label }}
          TARGET_SHA: ${{ steps.candidate.outputs.source_sha }}
        shell: bash
        run: scripts/publish-agent-release.sh release
