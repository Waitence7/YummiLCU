name: Deploy Agent Beta 38 Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-agent-beta-38-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download verified agent candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          gh run download 41372210230 --repo "$GITHUB_REPOSITORY" --name agent-candidate --dir release
          test -s release/agent-version.json
          jq -e '.version == "0.8.0" and .tauri.version == "0.8.0" and .tauri.commit == "a34e74c"' release/agent-version.json >/dev/null
          test -s release/Yummi-LCU-Agent-0.8.0-setup.exe
          test -s release/tauri-0.8.0.zip

      - name: Prepare beta.38 signed manifest
        env:
          YUMMI_AGENT_MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(jq -r '.tauri.buildId // .buildId' release/agent-version.json)"
          stage="${RUNNER_TEMP}/tauri-portable"
          rm -rf "$stage"
          mkdir -p "$stage"
          unzip -q release/tauri-0.8.0.zip -d "$stage"
          exe="$(find "$stage" -maxdepth 2 -type f -iname 'yummi-lcu-tauri.exe' -print -quit)"
          test -n "$exe" && test -s "$exe"
          node scripts/sync-tauri-agent-version.mjs \
            --zip release/tauri-0.8.0.zip \
            --exe "$exe" \
            --out release/agent-version.json \
            --notes "Overlay input capture: block underlying game clicks while clicking or dragging overlay controls." \
            --channel beta \
            --release-label 0.8.0-beta.38 \
            --build-id "$build_id" \
            --commit a34e74c \
            --rollout-percent 100
          jq -e '.version == "0.8.0" and .tauri.channel == "beta" and .tauri.releaseLabel == "0.8.0-beta.38" and .tauri.commit == "a34e74c" and .tauri.rolloutPercent == 100' release/agent-version.json >/dev/null

      - name: Publish beta.38
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_DEPLOY_TOKEN: ${{ secrets.YUMMI_AGENT_DEPLOY_TOKEN }}
          RELEASE_CHANNEL: beta
          RELEASE_LABEL: 0.8.0-beta.38
          TARGET_SHA: a34e74ce29fd9ff25cde67d2171fea17c265741b
        shell: bash
        run: scripts/publish-agent-release.sh release
