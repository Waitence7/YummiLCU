name: Deploy Agent Beta 49 Isolated Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-agent-beta-47-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: b40faa37e81747f32e76cd6366cb360b021e581f
      SOURCE_SHORT: b40faa3
      RELEASE_LABEL: 0.8.0-beta.49
      PUBLIC_KEY_VAR: ${{ vars.YUMMI_AGENT_MANIFEST_PUBLIC_KEY }}
      PUBLIC_KEY_SECRET: ${{ secrets.YUMMI_AGENT_MANIFEST_PUBLIC_KEY }}
      CERT_THUMBPRINT_VAR: ${{ vars.YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT }}
      CERT_THUMBPRINT_SECRET: ${{ secrets.YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT }}
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/agent-tauri/src-tauri/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b40faa37e81747f32e76cd6366cb360b021e581f

      - name: Configure beta.49 metadata
        run: |
          $buildId = "20261102.1000"
          "YUMMI_AGENT_RELEASE_CHANNEL=beta" >> $env:GITHUB_ENV
          "YUMMI_AGENT_RELEASE_LABEL=$env:RELEASE_LABEL" >> $env:GITHUB_ENV
          "YUMMI_AGENT_BUILD_ID=$buildId" >> $env:GITHUB_ENV
          "YUMMI_AGENT_GIT_COMMIT=$env:SOURCE_SHORT" >> $env:GITHUB_ENV
          "BETA49_BUILD_ID=$buildId" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-tauri/package-lock.json

      - name: Configure update verification keys
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
        run: |
          if (-not $env:MANIFEST_SIGNING_KEY) { throw "YUMMI_AGENT_MANIFEST_SIGNING_KEY is required" }
          $publicKey = if ($env:PUBLIC_KEY_VAR) { $env:PUBLIC_KEY_VAR } else { $env:PUBLIC_KEY_SECRET }
          if (-not $publicKey) { throw "YUMMI_AGENT_MANIFEST_PUBLIC_KEY is required" }
          "YUMMI_AGENT_MANIFEST_PUBLIC_KEY=$publicKey" >> $env:GITHUB_ENV
          $thumbprint = if ($env:CERT_THUMBPRINT_VAR) { $env:CERT_THUMBPRINT_VAR } else { $env:CERT_THUMBPRINT_SECRET }
          if ($thumbprint) { "YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV }

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-tauri/src-tauri
          cache-targets: true
          cache-all-crates: true

      - name: Run Rust tests
        working-directory: agent-tauri/src-tauri
        run: cargo test --locked --jobs 4

      - name: Install frontend dependencies
        working-directory: agent-tauri
        run: npm ci

      - name: Typecheck frontend
        working-directory: agent-tauri
        run: npm exec -- tsc --noEmit

      - name: Build Tauri bundles
        working-directory: agent-tauri
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Locate and sign artifacts
        id: artifacts
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $releaseRoot = "agent-tauri/src-tauri/target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path $releaseRoot)) { $releaseRoot = "agent-tauri/src-tauri/target/release" }
          $exe = Join-Path $releaseRoot "yummi-lcu-tauri.exe"
          if (-not (Test-Path $exe)) { throw "Tauri exe not found: $exe" }
          $nsis = Get-ChildItem "$releaseRoot/bundle/nsis" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          if ($env:WINDOWS_CERTIFICATE) {
            if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required" }
            $certPath = Join-Path $env:RUNNER_TEMP "yummi-agent-code-signing.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert) { throw "failed to import code signing certificate" }
            if ($env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT -and ($cert.Thumbprint.ToLowerInvariant() -ne $env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT.ToLowerInvariant())) { throw "certificate thumbprint mismatch" }
            foreach ($file in @($exe, $nsis.FullName)) {
              Set-AuthenticodeSignature -FilePath $file -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256 | Out-Null
              $sig = Get-AuthenticodeSignature -FilePath $file
              $selfSigned = $cert.Subject -eq $cert.Issuer
              $expectedSelfSignedTrustFailure = $selfSigned -and $sig.SignerCertificate -and ($sig.SignerCertificate.Thumbprint -eq $cert.Thumbprint) -and ($sig.StatusMessage -match '(?i)root certificate which is not trusted by the trust provider')
              if ($sig.Status -ne "Valid" -and -not $expectedSelfSignedTrustFailure) { throw "code signing validation failed for ${file}: $($sig.Status)" }
            }
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          } elseif ($env:YUMMI_AGENT_WINDOWS_SIGNING_THUMBPRINT) {
            throw "signing thumbprint is configured but WINDOWS_CERTIFICATE is missing"
          }
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "nsis=$($nsis.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build beta.49 release payload
        env:
          YUMMI_AGENT_MANIFEST_SIGNING_KEY: ${{ secrets.YUMMI_AGENT_MANIFEST_SIGNING_KEY }}
        run: |
          $version = (Get-Content agent-tauri/package.json | ConvertFrom-Json).version
          $release = Join-Path $env:RUNNER_TEMP "beta49-release"
          $stage = Join-Path $env:RUNNER_TEMP "beta49-portable"
          New-Item -ItemType Directory -Force -Path $release, $stage | Out-Null
          $stageExe = Join-Path $stage "yummi-lcu-tauri.exe"
          Copy-Item "${{ steps.artifacts.outputs.exe }}" $stageExe -Force
          $zip = Join-Path $release "tauri-$version.zip"
          Compress-Archive -Path $stageExe -DestinationPath $zip -Force
          $setup = Join-Path $release "Yummi-LCU-Agent-$version-setup.exe"
          Copy-Item "${{ steps.artifacts.outputs.nsis }}" $setup -Force
          node scripts/sync-tauri-agent-version.mjs `
            --zip $zip `
            --exe $stageExe `
            --out (Join-Path $release "agent-version.json") `
            --notes "Fix manual beta apply by ordering beta release labels before non-monotonic CI build IDs." `
            --channel beta `
            --release-label $env:RELEASE_LABEL `
            --build-id $env:BETA49_BUILD_ID `
            --commit $env:SOURCE_SHORT `
            --rollout-percent 100

      - uses: actions/upload-artifact@v4
        with:
          name: beta49-release
          path: ${{ runner.temp }}/beta49-release/*
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b40faa37e81747f32e76cd6366cb360b021e581f
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: beta49-release
          path: release
      - name: Publish beta.49
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_DEPLOY_TOKEN: ${{ secrets.YUMMI_AGENT_DEPLOY_TOKEN }}
          RELEASE_CHANNEL: beta
          RELEASE_LABEL: 0.8.0-beta.49
          TARGET_SHA: b40faa37e81747f32e76cd6366cb360b021e581f
        run: scripts/publish-agent-release.sh release

