[project]
name = "YummiLcu"
version = "0.1.0"
description = "LCU relay (FastAPI) and Windows agent for Yummibot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "redis>=7.4.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
yummi-lcu-relay = "relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]
