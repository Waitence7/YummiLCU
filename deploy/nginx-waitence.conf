server {
    listen 80;
    listen [::]:80;
    server_name yummi.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yummi.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/yummi.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yummi.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 에이전트 자동 업데이트 (Relay 재시작 없이 manifest·zip 서빙)
    location = /agent/version.json {
        alias /var/www/yummi-agent/agent-version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /agent/YummiAgent.zip {
        alias /var/www/yummi-agent/YummiAgent.zip;
        default_type application/zip;
    }

    location ~ ^/agent/(YummiAgent-Setup-.+\.exe)$ {
        alias /var/www/yummi-agent/$1;
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
