server {
    listen 80;
    listen [::]:80;
    server_name yummi.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yummi.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/yummi.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yummi.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # WebSocket — 쿼리스트링(과거 ws_token 등) 미기록
    log_format yummi_ws_safe '$remote_addr - $remote_user [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    # 에이전트 자동 업데이트 (Relay 재시작 없이 manifest·zip 서빙)
    location = /agent/version.json {
        alias /var/www/yummi-agent/agent-version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /agent/YummiAgent.zip {
        alias /var/www/yummi-agent/YummiAgent.zip;
        default_type application/zip;
    }

    location = /agent/setup.exe {
        alias /var/www/yummi-agent/setup.exe;
        default_type application/octet-stream;
    }

    location = /agent/latest.json {
        alias /var/www/yummi-agent/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /agent/latest {
        alias /var/www/yummi-agent/latest;
        default_type application/octet-stream;
    }

    location /agent/files/ {
        alias /var/www/yummi-agent/files/;
        default_type application/octet-stream;
    }

    # 봇 전용 internal API — 공인 인터넷에서 직접 호출 차단 (로컬/봇만)
    location /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws/ {
        access_log /var/log/nginx/yummi-ws.access.log yummi_ws_safe;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
